```html
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gerenciador de Links & Compartilhador</title>

  <!-- Biblioteca para gerar QR Code -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #333333;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bluetooth: #0082fc;
      --danger: #dc2626;
      --border: #e5e7eb;
      --qr: #7c3aed;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    h1,
    h2 {
      text-align: center;
      color: #1e293b;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      border: 1px solid var(--border);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .link-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }

    .link-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .link-info h3 {
      font-size: 16px;
      color: #0f172a;
    }

    .link-info a {
      font-size: 14px;
      color: var(--primary);
      text-decoration: none;
      word-break: break-all;
    }

    .link-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .btn-share {
      background-color: var(--success);
      color: white;
      font-size: 12px;
    }

    .btn-bluetooth {
      background-color: var(--bluetooth);
      color: white;
      font-size: 12px;
    }

    .btn-qr {
      background-color: var(--qr);
      color: white;
      font-size: 12px;
    }

    .btn-delete {
      background-color: var(--danger);
      color: white;
      font-size: 12px;
      margin-left: auto;
    }

    .empty-state {
      text-align: center;
      color: #64748b;
      padding: 20px 0;
    }

    /* ============================= */
    /* MODAL DO QR CODE */
    /* ============================= */

    .qr-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);

      display: none;

      align-items: center;
      justify-content: center;

      padding: 20px;

      z-index: 9999;
    }

    .qr-modal.active {
      display: flex;
    }

    .qr-box {
      background: white;
      width: 100%;
      max-width: 380px;

      padding: 25px;

      border-radius: 16px;

      text-align: center;

      box-shadow:
        0 20px 40px rgba(0, 0, 0, 0.2);
    }

    .qr-box h2 {
      margin-bottom: 8px;
    }

    .qr-box p {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 20px;
      word-break: break-all;
    }

    #qrcode {
      width: 256px;
      height: 256px;

      margin: 0 auto 20px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qrcode img {
      max-width: 100%;
      height: auto;
    }

    .qr-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-download {
      background: var(--success);
      color: white;
    }

    .btn-close {
      background: #64748b;
      color: white;
    }

    @media (max-width: 500px) {
      body {
        padding: 12px;
      }

      .link-actions button {
        flex: 1;
        min-width: 100px;
      }

      .btn-delete {
        margin-left: 0;
      }

      #qrcode {
        width: 220px;
        height: 220px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Gerenciador de Links</h1>

    <!-- Formulário -->
    <div class="card">

      <h2>Adicionar Novo Site</h2>

      <form id="linkForm">

        <input
          type="text"
          id="siteName"
          placeholder="Nome do Site (ex: Google)"
          required
        />

        <input
          type="url"
          id="siteUrl"
          placeholder="URL do Site (ex: https://google.com)"
          required
        />

        <button
          type="submit"
          class="btn-primary"
        >
          Salvar no LocalStorage
        </button>

      </form>

    </div>


    <!-- Lista -->
    <div class="card">

      <h2>Meus Sites Salvos</h2>

      <ul id="linkList" class="link-list"></ul>

    </div>

  </div>


  <!-- ============================= -->
  <!-- MODAL QR CODE -->
  <!-- ============================= -->

  <div
    id="qrModal"
    class="qr-modal"
  >

    <div class="qr-box">

      <h2 id="qrTitle">
        QR Code
      </h2>

      <p id="qrUrl"></p>

      <div id="qrcode"></div>

      <div class="qr-actions">

        <button
          class="btn-download"
          onclick="downloadQRCode()"
        >
          ⬇ Baixar
        </button>

        <button
          class="btn-close"
          onclick="closeQRCode()"
        >
          Fechar
        </button>

      </div>

    </div>

  </div>


  <script>

    const linkForm =
      document.getElementById("linkForm");

    const siteNameInput =
      document.getElementById("siteName");

    const siteUrlInput =
      document.getElementById("siteUrl");

    const linkList =
      document.getElementById("linkList");

    const qrModal =
      document.getElementById("qrModal");

    const qrTitle =
      document.getElementById("qrTitle");

    const qrUrl =
      document.getElementById("qrUrl");

    const qrContainer =
      document.getElementById("qrcode");


    /*
    ==========================================
    CARREGAR LINKS
    ==========================================
    */

    document.addEventListener(
      "DOMContentLoaded",
      loadLinks
    );


    /*
    ==========================================
    ADICIONAR LINK
    ==========================================
    */

    linkForm.addEventListener(
      "submit",
      function (e) {

        e.preventDefault();

        const name =
          siteNameInput.value.trim();

        const url =
          siteUrlInput.value.trim();

        if (name && url) {

          const newLink = {

            id: Date.now(),

            name: name,

            url: url

          };

          saveLink(newLink);

          siteNameInput.value = "";

          siteUrlInput.value = "";

          loadLinks();

        }

      }
    );


    /*
    ==========================================
    OBTER LINKS
    ==========================================
    */

    function getStoredLinks() {

      const links =
        localStorage.getItem("user_links");

      return links
        ? JSON.parse(links)
        : [];

    }


    /*
    ==========================================
    SALVAR LINK
    ==========================================
    */

    function saveLink(link) {

      const links =
        getStoredLinks();

      links.push(link);

      localStorage.setItem(
        "user_links",
        JSON.stringify(links)
      );

    }


    /*
    ==========================================
    APAGAR LINK
    ==========================================
    */

    function deleteLink(id) {

      let links =
        getStoredLinks();

      links =
        links.filter(
          link => link.id !== id
        );

      localStorage.setItem(
        "user_links",
        JSON.stringify(links)
      );

      loadLinks();

    }


    /*
    ==========================================
    MOSTRAR LINKS
    ==========================================
    */

    function loadLinks() {

      const links =
        getStoredLinks();

      linkList.innerHTML = "";


      if (links.length === 0) {

        linkList.innerHTML = `
          <li class="empty-state">
            Nenhum site guardado ainda.
          </li>
        `;

        return;

      }


      links.forEach(link => {

        const li =
          document.createElement("li");

        li.className =
          "link-item";


        li.innerHTML = `

          <div class="link-info">

            <h3>
              ${escapeHtml(link.name)}
            </h3>

            <a
              href="${escapeHtml(link.url)}"
              target="_blank"
              rel="noopener noreferrer"
            >
              ${escapeHtml(link.url)}
            </a>

          </div>


          <div class="link-actions">

            <button
              class="btn-share"
              onclick="shareNative(
                '${escapeJs(link.name)}',
                '${escapeJs(link.url)}'
              )"
            >
              📤 Partilhar
            </button>


            <button
              class="btn-qr"
              onclick="showQRCode(
                '${escapeJs(link.name)}',
                '${escapeJs(link.url)}'
              )"
            >
              ▣ QR Code
            </button>


            <button
              class="btn-bluetooth"
              onclick="shareBluetooth(
                '${escapeJs(link.name)}',
                '${escapeJs(link.url)}'
              )"
            >
              🔵 Bluetooth
            </button>


            <button
              class="btn-delete"
              onclick="deleteLink(${link.id})"
            >
              🗑 Apagar
            </button>

          </div>

        `;

        linkList.appendChild(li);

      });

    }


    /*
    ==========================================
    GERAR QR CODE
    ==========================================
    */

    function showQRCode(title, url) {

      qrTitle.textContent =
        "QR Code — " + title;

      qrUrl.textContent =
        url;


      /*
      Limpa QR Code anterior
      */

      qrContainer.innerHTML = "";


      /*
      Cria novo QR Code
      */

      new QRCode(
        qrContainer,
        {
          text: url,

          width: 256,

          height: 256,

          colorDark: "#000000",

          colorLight: "#ffffff",

          correctLevel:
            QRCode.CorrectLevel.H
        }
      );


      /*
      Abre modal
      */

      qrModal.classList.add(
        "active"
      );

    }


    /*
    ==========================================
    FECHAR QR CODE
    ==========================================
    */

    function closeQRCode() {

      qrModal.classList.remove(
        "active"
      );

    }


    /*
    ==========================================
    FECHAR CLICANDO FORA
    ==========================================
    */

    qrModal.addEventListener(
      "click",
      function (event) {

        if (
          event.target === qrModal
        ) {

          closeQRCode();

        }

      }
    );


    /*
    ==========================================
    BAIXAR QR CODE
    ==========================================
    */

    function downloadQRCode() {

      const img =
        qrContainer.querySelector("img");

      if (!img) {

        alert(
          "QR Code ainda não foi gerado."
        );

        return;

      }


      const link =
        document.createElement("a");

      link.href =
        img.src;

      link.download =
        "qrcode.png";

      link.click();

    }


    /*
    ==========================================
    PARTILHAR
    ==========================================
    */

    async function shareNative(
      title,
      url
    ) {

      if (navigator.share) {

        try {

          await navigator.share({

            title: title,

            text:
              `Confere este site: ${title}`,

            url: url

          });

        }

        catch (err) {

          if (
            err.name !== "AbortError"
          ) {

            console.error(
              "Erro ao partilhar:",
              err
            );

          }

        }

      }

      else {

        try {

          await navigator.clipboard
            .writeText(url);

          alert(
            "Link copiado para a área de transferência!"
          );

        }

        catch {

          alert(
            "Não foi possível copiar o link."
          );

        }

      }

    }


    /*
    ==========================================
    BLUETOOTH
    ==========================================
    */

    async function shareBluetooth(
      title,
      url
    ) {

      if (!navigator.bluetooth) {

        alert(
          "A API Web Bluetooth não é suportada neste navegador/dispositivo."
        );

        return;

      }


      try {

        const device =
          await navigator.bluetooth
            .requestDevice({

              acceptAllDevices: true,

              optionalServices: [
                "generic_access"
              ]

            });


        alert(

          `Dispositivo Bluetooth encontrado:

${device.name || "Dispositivo desconhecido"}

Para enviar diretamente o link para outro telemóvel, utilize a opção "Partilhar" do sistema.`

        );

      }

      catch (error) {

        if (
          error.name !== "NotFoundError"
        ) {

          console.error(
            "Erro de Bluetooth:",
            error
          );

        }

      }

    }


    /*
    ==========================================
    PROTEÇÃO XSS
    ==========================================
    */

    function escapeHtml(str) {

      return String(str).replace(
        /[&<>"']/g,

        function (m) {

          return {

            "&": "&amp;",

            "<": "&lt;",

            ">": "&gt;",

            '"': "&quot;",

            "'": "&#039;"

          }[m];

        }
      );

    }


    /*
    Proteção para strings
    usadas dentro do onclick
    */

    function escapeJs(str) {

      return String(str)

        .replace(/\\/g, "\\\\")

        .replace(/'/g, "\\'")

        .replace(/"/g, '\\"')

        .replace(/\n/g, "\\n")

        .replace(/\r/g, "\\r");

    }

  </script>

</body>
</html>
